<!doctype html>
<html lang="zh-CN" data-mode="panel" data-version="0.1.3"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="pi-plugin-chrome" content="v2"><title>PI Canvas</title><style>/* SHELL_CSS */</style></head>
<body><div class="app">
  <aside class="sidebar"><div class="sidebar-head"><a class="brand" href="#"><span class="brand-icon">C</span><span>Canvas<small>PI-Desktop</small></span></a><button id="library-close" class="quiet" data-i18n-aria-label="closeLibrary" data-i18n-title="closeLibrary" data-i18n="removeGlyph"></button></div>
    <button id="new" class="primary wide" data-i18n="newCanvas"></button><button id="open-file" class="outline wide" data-i18n="openFileArrow"></button><div class="sidebar-label"><span id="library-label" data-i18n="recentCanvases"></span><span id="count">0</span></div><nav id="canvases" data-i18n-aria-label="savedCanvasesAria"></nav>
    <div class="sidebar-bottom"><button id="trash-toggle" class="quiet wide" data-i18n="deletedCount" data-i18n-params='{"count":0}'></button><button id="probe-toggle" class="quiet wide" data-i18n="hostCapabilities"></button><span class="version">PI Canvas 0.1.3</span></div>
  </aside>
  <main class="workspace"><header class="toolbar"><div class="toolbar-title"><span class="breadcrumb"><strong id="current-title">Canvas</strong></span><details class="file-details"><summary data-i18n="fileInfo"></summary><div id="revision" class="revision" data-i18n="openOrCreate"></div></details></div><div class="actions"><button id="library-toggle" class="quiet" aria-expanded="false" aria-controls="canvas-library" data-i18n="canvasList"></button><button id="open-inline" class="quiet" data-i18n="openFile"></button><button id="theme-toggle" class="quiet" aria-expanded="false" aria-controls="theme-panel"></button><button id="native-panel" class="quiet" hidden data-i18n="nativePanel"></button><button id="design-toggle" class="outline" aria-pressed="false" disabled data-i18n="designMode"></button><button id="refresh" class="quiet" data-i18n="refresh"></button><button id="copy" class="quiet" disabled data-i18n="copyContext"></button><button id="edit" class="quiet" disabled data-i18n="source"></button></div></header>
    <div id="notice" role="status" hidden></div>
    <div id="design-help" hidden data-i18n="designHelp"></div>
    <section id="welcome" class="welcome"><h1>Canvas</h1><p data-i18n="welcomeDescription"></p>
      <button id="welcome-open" class="outline" data-i18n="welcomeOpen"></button><div class="template-heading"><h2 data-i18n="chooseStartingPoint"></h2><span data-i18n="threeExamples"></span></div><div class="templates">
      <button class="template" data-example="report"><strong><span data-i18n="exampleReport"></span><span aria-hidden="true">↗</span></strong><p data-i18n="exampleReportDescription"></p></button>
      <button class="template" data-example="architecture"><strong><span data-i18n="exampleArchitecture"></span><span aria-hidden="true">↗</span></strong><p data-i18n="exampleArchitectureDescription"></p></button>
      <button class="template" data-example="review"><strong><span data-i18n="exampleReview"></span><span aria-hidden="true">↗</span></strong><p data-i18n="exampleReviewDescription"></p></button></div>
    </section>
    <section id="stage" data-i18n-aria-label="canvasPreview" hidden></section>
    <section id="selection-panel" data-i18n-aria-label="selectedPart" hidden>
      <div class="selection-heading"><strong id="selection-title" data-i18n="selected"></strong><div class="actions"><button id="selection-parent" class="quiet" data-i18n="selectParent"></button><button id="selection-clear" class="quiet" data-i18n="clearSelection"></button></div></div>
      <blockquote id="selection-text"></blockquote>
      <label for="selection-request" data-i18n="editPart"></label><textarea id="selection-request" rows="2" maxlength="4000" data-i18n-placeholder="selectionPlaceholder"></textarea>
      <div class="actions"><button id="selection-attach" class="outline" data-i18n="addToChat"></button><button id="selection-send" class="primary" data-i18n="sendEditRequest"></button><button id="selection-copy" class="quiet" data-i18n="copySelection"></button></div><p id="selection-host-note"></p>
    </section>
    <section id="file-panel" class="editor" data-i18n-aria-label="openCanvasFile" hidden><div class="editor-head"><div><h2 data-i18n="openCanvasFile"></h2><p data-i18n="openCanvasDescription"></p></div><button id="file-close" class="quiet" data-i18n="close"></button></div>
      <label for="library-directory" data-i18n="defaultDirectory"></label><input id="library-directory" readonly data-i18n-aria-label="defaultDirectory"><div class="actions folder-actions"><button id="library-path-copy" class="outline" data-i18n="copyDirectory"></button><button id="library-folder-open" class="outline" data-i18n="openFolder"></button></div>
      <div class="library-tabs" role="group" data-i18n-aria-label="fileCategories"><button id="file-saved" class="quiet" aria-pressed="true" data-i18n="savedCount" data-i18n-params='{"count":0}'></button><button id="file-deleted" class="quiet" aria-pressed="false" data-i18n="deletedCount" data-i18n-params='{"count":0}'></button></div><div id="file-library-list" class="file-library-list" data-i18n-aria-label="directoryCanvases"></div>
      <details class="external-files"><summary data-i18n="openOtherFiles"></summary>
      <label for="file-picker" data-i18n="chooseFile"></label><input id="file-picker" type="file" accept=".tsx,.jsx"><p data-i18n="fileImportHelp"></p>
      <label for="file-path" data-i18n="projectFilePath"></label><input id="file-path" data-i18n-placeholder="filePathPlaceholder" spellcheck="false"><label class="watch-option"><input id="file-watch" type="checkbox" checked><span data-i18n="watchFile"></span></label>
      <button id="file-path-open" class="primary wide" data-i18n="openAndRender"></button><p data-i18n="sdkFileHelp"></p>
      </details>
    </section>
    <section id="theme-panel" class="editor theme-panel" data-i18n-aria-label="canvasTheme" hidden><div class="editor-head"><div><h2 data-i18n="canvasTheme"></h2><p data-i18n="themeHelp"></p></div><button id="theme-close" class="quiet" data-i18n="close"></button></div>
      <div id="theme-options" class="theme-options" role="group" data-i18n-aria-label="chooseTheme"></div><p id="theme-status" role="status"></p>
    </section>
    <section id="editor" class="editor" data-i18n-aria-label="editCanvas" hidden><div class="editor-head"><div><h2 data-i18n="editCanvas"></h2><p data-i18n="editorHelp"></p></div><button id="editor-close" class="quiet" data-i18n="close"></button></div><label for="title-input" data-i18n="title"></label><input id="title-input" maxlength="160"><label for="source-input" data-i18n="tsxSource"></label><textarea id="source-input" spellcheck="false" data-i18n-aria-label="tsxSource"></textarea><div id="diagnostics" role="alert"></div><footer><span id="editor-version"></span><button id="publish" class="primary" data-i18n="publishCanvas"></button></footer></section>
    <section id="probe" class="probe" data-i18n-aria-label="observeHost" hidden><div class="editor-head"><h2 data-i18n="observeHost"></h2><button id="probe-close" class="quiet" data-i18n="close"></button></div><p data-i18n="probeHelp"></p><pre id="probe-result"></pre><div class="actions"><button id="probe-ping" class="outline" data-i18n="recordToolCall"></button><button id="probe-save" class="outline" data-i18n="saveObservation"></button><button id="context-send" class="outline" disabled data-i18n="addModelContext"></button></div><label for="feedback" data-i18n="boundEditRequest"></label><textarea id="feedback" data-i18n-placeholder="feedbackPlaceholder"></textarea><div class="actions"><button id="feedback-copy" class="outline" data-i18n="copyEditRequest"></button><button id="feedback-send" class="primary" disabled data-i18n="sendBoundChat"></button></div></section>
    <footer class="statusbar"><span id="connection" data-i18n="connecting"></span><span id="render-status" data-i18n="notRendered"></span><span id="binding-status" data-i18n="unbound"></span><span id="save-status" data-i18n="localInteraction"></span></footer>
  </main></div>
  <dialog id="purge-dialog" aria-labelledby="purge-heading" aria-describedby="purge-description"><h2 id="purge-heading" data-i18n="purgeHeading"></h2><p id="purge-target"></p><p id="purge-description" data-i18n="purgeDescription"></p><label for="purge-title" data-i18n="purgeLabel"></label><input id="purge-title" maxlength="160" autocomplete="off" spellcheck="false"><p id="purge-error" role="alert"></p><div class="actions dialog-actions"><button id="purge-cancel" class="outline" data-i18n="cancel"></button><button id="purge-confirm" class="danger" disabled data-i18n="purge"></button></div></dialog>
  <script>/* SHELL_JS */</script></body></html>
